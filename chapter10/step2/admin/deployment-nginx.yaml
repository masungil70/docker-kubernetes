apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-nginx-deployment
  namespace: development # development  네임스페이스 지정  
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-nginx
  template:
    metadata:
      name: my-nginx-pod
      labels:
        app: my-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.10
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: my-nginx-service  # curl my-nginx-service 명령어와 일치하는 서비스 이름
  namespace: development
spec:
  selector:
    app: my-nginx  # my-nginx-pod 파드 라벨과 일치해야 함
  ports:
    - protocol: TCP
      port: 80        # 서비스가 사용할 포트
      targetPort: 80  # 파드 내부의 컨테이너가 사용하는 포트
  type: ClusterIP     #서비스가 클러스터 내부에서만 접근 가능하도록 설정합니다.
