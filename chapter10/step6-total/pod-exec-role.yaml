apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-exec-role
  namespace: development
rules:
# 'exec' 명령을 사용하기 위해 어떤 파드가 있는지 확인하는 권한
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
# 파드에 접속(exec)하는 권한
- apiGroups: [""]
  # 'exec'는 pods 리소스의 exec 하위 리소스에 대한 create 동사로 처리됩니다.
  resources: ["pods/exec"]
  verbs: ["create"]