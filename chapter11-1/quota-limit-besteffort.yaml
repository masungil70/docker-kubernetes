# 이 YAML 파일은 ResourceQuota 객체를 정의합니다.
# 이 할당량은 특정 범위(scope)에 있는 리소스만 계산하도록 설정되어 있습니다.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: besteffort-quota
  # 이 할당량은 'default' 네임스페이스에 적용됩니다.
  namespace: default
spec:
  hard:
    # 'count/pods'는 생성할 수 있는 Pod의 총 개수를 의미합니다.
    # 여기서는 1개로 제한하고 있습니다.
    count/pods: "1"
  # scopes 필드는 이 ResourceQuota가 어떤 종류의 Pod에 적용될지를 지정합니다.
  # 'BestEffort'는 requests와 limits를 설정하지 않은 Pod들만을 대상으로 한다는 의미입니다.
  # 즉, 이 설정은 default 네임스페이스 내에 BestEffort 등급의 Pod를 단 1개만 생성할 수 있도록 제한합니다.
  scopes:
    - BestEffort