# 이 YAML 파일은 Pod를 정의합니다.
# 이 Pod는 리소스의 limits만 설정하고 requests는 설정하지 않았습니다.
# 이 경우, 쿠버네티스의 동작은 다음과 같습니다.
# 1. 만약 네임스페이스에 LimitRange가 있고 defaultRequest가 설정되어 있다면, 그 값이 requests로 자동 할당됩니다.
# 2. LimitRange가 없다면, requests는 limits와 동일한 값으로 자동 설정됩니다. (이 경우 Guaranteed QoS가 됨)
# 이 파일은 이러한 쿠버네티스의 자동 할당 메커니즘을 확인하는 데 사용될 수 있습니다.
apiVersion: v1
kind: Pod
metadata:
  name: resource-limit-pod
  labels:
    name: resource-limit-pod
spec:
  containers:
  - name: nginx
    image: nginx:latest
    resources:
      # requests는 명시하지 않고 limits만 설정했습니다.
      limits:
        memory: "256Mi"
        cpu: "1000m"