# 이 YAML 파일은 포드 안티-어피니티(Pod Anti-Affinity)의 '선호(preferred)' 규칙을 사용하는 예제입니다.
# 특정 포드와 같은 토폴로지 도메인(예: 존, 리전)에 스케줄링되는 것을 피하려고 시도합니다.
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod-antiaffinity-preferred
spec:
  affinity:
    podAntiAffinity:
      # 'preferredDuringSchedulingIgnoredDuringExecution'은 스케줄링 시점에 규칙을 만족하는 것을 선호하지만,
      # 만족하는 노드가 없어도 스케줄링될 수 있음을 의미합니다.
      preferredDuringSchedulingIgnoredDuringExecution:
      - podAffinityTerm:
          labelSelector:
            matchExpressions:
            # 'mylabel/database' 레이블의 값이 'mysql'인 포드를 찾습니다.
            - key: mylabel/database
              operator: In
              values:
              - mysql
          # 'topologyKey'는 안티-어피니티 규칙을 적용할 지역적 범위를 정의합니다.
          # 'failure-domain.beta.kubernetes.io/zone'은 클라우드 제공업체의 가용성 존(AZ)을 의미합니다.
          # 즉, 'mysql' 포드가 있는 가용성 존을 피해서 스케줄링하려고 시도합니다.
          topologyKey: failure-domain.beta.kubernetes.io/zone
        # 이 선호 규칙의 가중치입니다 (1-100).
        weight: 80
  containers:
  - name: nginx
    image: nginx:latest