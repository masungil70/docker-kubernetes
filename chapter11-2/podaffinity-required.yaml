# 이 YAML 파일은 포드 어피니티(Pod Affinity)의 '필수(required)' 규칙을 사용하는 예제입니다.
# 특정 포드와 동일한 토폴로지 도메인(예: 가용성 존)에 스케줄링되도록 강제합니다.
apiVersion: v1
kind: Pod
metadata:
  name: nginx-podaffinity
spec:
  affinity:
    podAffinity:
      # 'requiredDuringSchedulingIgnoredDuringExecution'은 스케줄링 시점에 규칙을 반드시 만족해야 함을 의미합니다.
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          # 'mylabel/database' 레이블의 값이 'mysql'인 포드를 찾습니다.
          - key: mylabel/database
            operator: In
            values:
            - mysql
        # 'topologyKey'를 'failure-domain.beta.kubernetes.io/zone'으로 설정하여 동일한 가용성 존을 의미하도록 합니다.
        # 즉, 'mysql' 포드가 실행 중인 가용성 존에 이 포드를 스케줄링합니다.
        topologyKey: failure-domain.beta.kubernetes.io/zone
  containers:
  - name: nginx
    image: nginx:latest