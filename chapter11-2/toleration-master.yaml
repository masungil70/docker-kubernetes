# 이 YAML 파일은 테인트(Taint)가 적용된 마스터 노드에 포드를 스케줄링하기 위해
# 톨러레이션(Toleration)을 사용하는 예제입니다.
# 일반적으로 마스터 노드에는 다른 포드가 스케줄링되지 않도록 테인트가 설정되어 있습니다.
apiVersion: v1
kind: Pod
metadata:
  name: nginx-master-toleration
spec:
  # 'tolerations' 필드는 포드가 특정 테인트를 '용인'할 수 있도록 설정합니다.
  tolerations:
  # 'node-role.kubernetes.io/master' 키를 가진 모든 테인트를 용인합니다.
  # 'effect'를 명시하지 않으면 모든 종류의 effect를 용인합니다.
  # 마스터 노드의 NoSchedule 테인트를 용인하여 마스터 노드에 스케줄링될 수 있도록 합니다.
  - key: node-role.kubernetes.io/master
    effect: NoSchedule
    operator: Exists # 키만 존재하면 용인합니다.
  # 'nodeSelector'를 사용하여 명시적으로 마스터 노드에 스케줄링되도록 지정합니다.
  # 톨러레이션은 스케줄링을 허용할 뿐, 강제하지 않기 때문입니다.
  nodeSelector:
    node-role.kubernetes.io/master: ""
  containers:
  - name: nginx
    image: nginx:latest