# 이 YAML 파일은 쿠버네티스 파드(Pod)를 정의합니다.
apiVersion: v1
kind: Pod
metadata:
  name: completed-pod-restart-never
spec:
  # restartPolicy는 파드의 컨테이너가 종료되었을 때의 재시작 정책을 설정합니다.
  # "Never"는 컨테이너가 종료되면 파드를 재시작하지 않음을 의미합니다.
  # 파드는 "Completed" 상태가 됩니다.
  restartPolicy: Never
  containers:
  - name: completed-pod-restart-never
    image: busybox
    # "sh -c 'sleep 10 && exit 0'" 명령어는 10초 동안 대기한 후 정상적으로(종료 코드 0) 종료됩니다.
    command: ["sh"]
    args: ["-c", "sleep 10 && exit 0"]