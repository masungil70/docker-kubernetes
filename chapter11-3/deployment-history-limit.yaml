# 이 YAML 파일은 쿠버네티스 디플로이먼트(Deployment)를 정의합니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-history-limit
spec:
  # revisionHistoryLimit은 디플로이먼트의 이전 리비전(ReplicaSet)을 몇 개까지 저장할지를 결정합니다.
  # 여기서는 3으로 설정되어 있으므로, 최대 3개의 이전 버전이 유지됩니다.
  # 이를 통해 이전 버전으로 롤백할 수 있습니다.
  revisionHistoryLimit: 3
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      name: nginx
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.17
        ports:
        - containerPort: 80