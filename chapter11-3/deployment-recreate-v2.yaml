# 이 YAML 파일은 위의 deployment-recreate-v1.yaml과 함께 사용되어 업데이트를 시연합니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-recreate
spec:
  replicas: 3
  # "Recreate" 전략을 사용하여 업데이트합니다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      name: nginx
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        # nginx 1.16 버전 이미지로 업데이트합니다.
        image: nginx:1.16
        ports:
        - containerPort: 80