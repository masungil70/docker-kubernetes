# 이 YAML 파일은 쿠버네티스 디플로이먼트(Deployment)를 정의합니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-rolling-update
spec:
  replicas: 3
  # strategy는 디플로이먼트의 업데이트 전략을 설정합니다.
  # "RollingUpdate"는 파드를 하나씩 점진적으로 업데이트하는 전략으로, 다운타임 없이 업데이트가 가능합니다.
  # 디플로이먼트의 기본 전략입니다.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxSurge는 업데이트 중 replicas 개수를 초과하여 최대로 더 생성될 수 있는 파드의 수를 의미합니다.
      # 여기서는 2로 설정되어, 업데이트 시점에 최대 3(replicas) + 2 = 5개의 파드가 존재할 수 있습니다.
      maxSurge: 2
      # maxUnavailable은 업데이트 중 사용 불가능한 상태가 될 수 있는 파드의 최대 개수를 의미합니다.
      # 여기서는 2로 설정되어, 업데이트 시점에 최소 3(replicas) - 2 = 1개의 파드는 항상 사용 가능한 상태를 유지합니다.
      maxUnavailable: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      name: nginx
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.15
        ports:
        - containerPort: 80