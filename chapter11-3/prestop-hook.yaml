# 이 YAML 파일은 preStop 라이프사이클 훅(Lifecycle Hook)을 사용하는 파드를 정의합니다.
apiVersion: v1
kind: Pod
metadata:
  name: prestop-hook
spec:
  containers:
  - name: prestop-hook
    image: nginx
    # lifecycle은 컨테이너의 생명주기 동안 특정 시점에 실행될 훅을 정의합니다.
    lifecycle:
      # preStop 훅은 컨테이너가 종료되기 직전에 실행됩니다.
      # 이 훅은 컨테이너가 정상적으로 종료(graceful shutdown)되도록 하는 데 사용됩니다.
      # 훅이 완료될 때까지 컨테이너는 종료되지 않습니다.
      preStop:
        exec:
          # nginx 프로세스를 정상적으로 종료하는 명령어를 실행합니다.
          command: ["/usr/sbin/nginx","-s","quit"]
          # kubectl get events로 로그를 확인할 수 있습니다.