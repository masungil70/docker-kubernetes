# 이 YAML 파일은 롤링 업데이트 예제의 초기 버전을 정의합니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-rolling-update
spec:
  replicas: 4
  # 롤링 업데이트 전략을 사용합니다.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxSurge: 업데이트 중 최대로 추가될 수 있는 파드 수 (replicas 초과)
      maxSurge: 2
      # maxUnavailable: 업데이트 중 사용 불가능할 수 있는 최대 파드 수
      maxUnavailable: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      name: nginx
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        # nginx 1.15 버전 이미지를 사용합니다.
        image: nginx:1.15
        ports:
        - containerPort: 80