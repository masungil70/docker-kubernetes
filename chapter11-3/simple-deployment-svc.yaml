# 이 YAML 파일은 간단한 디플로이먼트(Deployment)와 서비스(Service)를 정의합니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webserver
  template:
    metadata:
      name: my-webserver
      labels:
        app: webserver
    spec:
      containers:
      - name: my-webserver
        image: alicek106/rr-test:echo-hostname
        ports:
        - containerPort: 80
        # resources는 컨테이너가 사용할 리소스의 양을 설정합니다.
        resources:
          # requests는 컨테이너에 할당할 최소 리소스 양을 의미합니다.
          requests:
            cpu: 300m # CPU 0.3 코어를 요청합니다.
---
apiVersion: v1
kind: Service
metadata:
  name: simple-deployment-svc
spec:
  ports:
    # 서비스는 8080 포트로 들어오는 요청을 대상 파드의 80 포트로 전달합니다.
    - name: web-port
      port: 8080
      targetPort: 80
  # "app: webserver" 레이블을 가진 파드를 선택하여 연결합니다.
  selector:
    app: webserver
  # ClusterIP 타입의 서비스는 클러스터 내부에서만 접근 가능한 가상 IP를 생성합니다.
  type: ClusterIP