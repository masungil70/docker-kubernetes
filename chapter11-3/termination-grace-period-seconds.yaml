# 이 YAML 파일은 terminationGracePeriodSeconds 속성을 사용하는 파드를 정의합니다.
apiVersion: v1
kind: Pod
metadata:
  name: termination-grace-period-seconds
spec:
  # terminationGracePeriodSeconds는 파드가 종료 요청을 받은 후, 컨테이너에 SIGTERM 신호를 보내고
  # 프로세스가 정상적으로 종료될 때까지 기다리는 유예 시간(초)을 설정합니다.
  # 이 시간이 지나도 프로세스가 종료되지 않으면 SIGKILL 신호로 강제 종료합니다.
  # 여기서는 10초로 설정되어 있습니다. 기본값은 30초입니다.
  terminationGracePeriodSeconds: 10
  containers:
  - name: termination-grace-period-seconds
    image: nginx
    lifecycle:
      # preStop 훅과 함께 사용하여 정상적인 종료(graceful shutdown)를 보장할 수 있습니다.
      preStop:
        exec:
          command: ["/usr/sbin/nginx","-s","quit"]