apiVersion: v1
kind: ServiceAccount
metadata:
  name: appdeploy-controller-sa
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: appdeploy-controller-clusterrole
rules:
# CRD 조회 (kopf 필요)
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch"]

# Events 기록 (kopf 로그/이벤트)
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]

# AppDeploy CRD
- apiGroups: ["kosa.go.kr"]
  resources: ["appdeploys", "appdeploys/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# 🔥 Deployment
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# 🔥 Service / Pod
- apiGroups: [""]
  resources: ["services", "pods"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# 🔥 HPA (문제의 핵심)
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: appdeploy-controller-clusterbinding
subjects:
- kind: ServiceAccount
  name: appdeploy-controller-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: appdeploy-controller-clusterrole
  apiGroup: rbac.authorization.k8s.io
