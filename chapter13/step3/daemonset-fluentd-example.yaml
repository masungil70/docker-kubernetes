# DaemonSet API 버전
apiVersion: apps/v1
# 리소스의 종류: DaemonSet
kind: DaemonSet
metadata:
  name: fluentd-log-collector
  labels:
    k8s-app: fluentd-logging
spec:
  # DaemonSet이 관리할 파드를 선택하기 위한 레이블 셀렉터
  # 아래 template.metadata.labels와 일치해야 합니다.
  selector:
    matchLabels:
      name: fluentd-log-collector
  # DaemonSet이 생성할 파드의 명세를 정의하는 템플릿
  template:
    metadata:
      labels:
        name: fluentd-log-collector
    spec:
      # 컨트롤 플레인 노드에도 파드를 스케줄링할 수 있도록 toleration을 추가합니다.
      # 마스터 노드는 보통 다른 파드가 스케줄링되지 않도록 Taint가 설정되어 있기 때문입니다.
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: fluentd
        # Fluentd 공식 쿠버네티스 데몬셋용 이미지
        image: fluent/fluentd-kubernetes-daemonset:v1-debian-1
        resources:
          limits:
            memory: 200Mi
          requests:
            cpu: 100m
            memory: 200Mi
        # 호스트(노드)의 파일 시스템 경로를 컨테이너 내부로 마운트합니다.
        volumeMounts:
        # 노드의 모든 컨테이너 로그가 저장되는 경로
        - name: varlog
          mountPath: /var/log
        # 도커 컨테이너의 로그 심볼릭 링크가 있는 경로
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
      # 컨테이너에 마운트할 볼륨을 정의합니다.
      volumes:
      # hostPath 볼륨은 노드의 파일시스템 경로를 파드에 직접 노출합니다.
      # DaemonSet에서 노드의 리소스를 읽거나 관리할 때 주로 사용됩니다.
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
