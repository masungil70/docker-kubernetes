apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  labels:
    app: mariadb
spec:
  serviceName: mariadb-headless
  replicas: 3 # 1 master + 2 replicas
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      # Ensure pods are scheduled on different nodes for high availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: mariadb
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: init-replication
          image: mariadb:10.6 # Use the same MariaDB image
          command: ["bash", "-c"]
          args:
            - |
              # Check if this is the master pod (mariadb-0)
              if [[ "$(hostname)" == "mariadb-0" ]]; then
                echo "Initializing mariadb-0 as master..."
                # Master doesn't need to configure replication from another master
                # It just needs to ensure its own setup is complete.
                # The 01_init_primary.sql will be run by the main container.
                exit 0
              fi

              # For replica pods (mariadb-1, mariadb-2, etc.)
              echo "Initializing $(hostname) as replica..."

              # Wait for mariadb-0 (master) to be ready
              until mariadb -h mariadb-0.mariadb-headless -u repl_user -p$(cat /etc/secrets/mariadb-replication-password) -e "SELECT 1"; do
                echo "Waiting for mariadb-0 to be ready...";
                sleep 5;
              done;

              # Get master's binary log status
              MASTER_STATUS=$(mariadb -h mariadb-0.mariadb-headless -u repl_user -p$(cat /etc/secrets/mariadb-replication-password) -e "SHOW MASTER STATUS\G")
              MASTER_LOG_FILE=$(echo "$MASTER_STATUS" | grep File: | awk '{print $2}')
              MASTER_LOG_POS=$(echo "$MASTER_STATUS" | grep Position: | awk '{print $2}')

              echo "Master Log File: $MASTER_LOG_FILE"
              echo "Master Log Position: $MASTER_LOG_POS"

              # Construct the CHANGE MASTER TO command
              CHANGE_MASTER_CMD="STOP SLAVE; CHANGE MASTER TO MASTER_HOST='mariadb-0.mariadb-headless', MASTER_USER='repl_user', MASTER_PASSWORD='$(cat /etc/secrets/mariadb-replication-password)', MASTER_LOG_FILE='$MASTER_LOG_FILE', MASTER_LOG_POS=$MASTER_LOG_POS; START SLAVE;"

              # Write the CHANGE MASTER TO command to a file that will be executed by the main container
              # This ensures the main container runs the replication setup after its own initialization
              echo "$CHANGE_MASTER_CMD" > /docker-entrypoint-initdb.d/02_change_master.sql
              echo "Generated /docker-entrypoint-initdb.d/02_change_master.sql"

          volumeMounts:
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d # Mount point for init scripts
            - name: mariadb-secret-volume
              mountPath: /etc/secrets
              readOnly: true
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: mariadb-root-password
      
      containers:
        - name: mariadb
          image: mariadb:10.6
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: mariadb-root-password
            - name: MARIADB_DATABASE
              value: kosa_db
            - name: MARIADB_USER
              value: kosa
            - name: MARIADB_PASSWORD
              value: "1004" # This should ideally come from a secret too
          ports:
            - containerPort: 3306
              name: mariadb
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
            - name: mariadb-init-scripts
              mountPath: /docker-entrypoint-initdb.d/01_init_primary.sql # Mount primary init script
              subPath: 01_init_primary.sql
            - name: mariadb-init-scripts-replica
              mountPath: /docker-entrypoint-initdb.d/01_init_replica.sql # Mount replica init script (not directly used by initContainer, but good to have)
              subPath: 01_init_replica.sql
            - name: mariadb-secret-volume
              mountPath: /etc/secrets
              readOnly: true
          livenessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -u root -p\"$MARIADB_ROOT_PASSWORD\"", "--", "MARIADB_ROOT_PASSWORD=$(MARIADB_ROOT_PASSWORD)"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -u root -p\"$MARIADB_ROOT_PASSWORD\"", "--", "MARIADB_ROOT_PASSWORD=$(MARIADB_ROOT_PASSWORD)"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: init-scripts
          configMap:
            name: mariadb-init-scripts
        - name: mariadb-init-scripts
          configMap:
            name: mariadb-init-scripts
            items:
              - key: 01_init_primary.sql
                path: 01_init_primary.sql
        - name: mariadb-init-scripts-replica
          configMap:
            name: mariadb-init-scripts
            items:
              - key: 01_init_replica.sql
                path: 01_init_replica.sql
        - name: mariadb-secret-volume
          secret:
            secretName: mariadb-secret

  volumeClaimTemplates:
    - metadata:
        name: mariadb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path           
        resources:
          requests:
            storage: 1Gi