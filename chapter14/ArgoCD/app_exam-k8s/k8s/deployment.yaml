apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostname-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webserver
  template:
    metadata:
      name: my-webserver
      labels:
        app: webserver
    spec:
      containers:
      - name: my-webserver
        image: masungil/echo-hostname:dcca343ec38e88515f002a728154ed10401b6924
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
