apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs # <-- 이 이름이 custom-values.initial.yaml의 storageClassName과 일치해야 합니다.
provisioner: k8s-sigs.io/nfs-subdir-external-provisioner # <-- 위 프로비저너 이름과 일치
parameters:
  archiveOnDelete: "false" # PV 삭제 시 데이터 보존 여부 (true: 보존, false: 삭제)
reclaimPolicy: Delete # PV 삭제 시 데이터 처리 정책 (Delete: 삭제, Retain: 보존)
volumeBindingMode: Immediate